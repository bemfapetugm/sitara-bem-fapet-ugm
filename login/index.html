<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITARA | Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <main class="login-page">
        <!-- LEFT SECTION -->
        <section class="login-brand">
            <div class="brand-content">
                <!-- Logo -->
                <div class="brand-logo">
                    <img src="../assets/images/logo.png" alt="Logo SITARA">
                </div>
                <!-- Brand Name -->
                <div class="brand-title">
                    <h1>SITARA</h1>
                    <p>
                        Sistem Integrasi Tata Birokrasi Mahasiswa
                    </p>
                </div>
                <!-- Tagline -->
                <div class="brand-tagline">
                    <h2>
                        Langkah Bersama,<br>
                        Tertib Selaras Berkarya
                    </h2>
                </div>
                <!-- Feature -->
                <div class="brand-feature">
                    <span>Transparan</span>
                    <span>Efektif</span>
                    <span>Berdampak</span>
                </div>
            </div>
            <footer class="brand-footer">
                © 2026 BEM Fakultas Peternakan UGM. 
                Hak cipta dilindungi.
            </footer>
        </section>
        <!-- RIGHT SECTION -->
        <section class="login-panel">
            <div class="login-card">
                <header class="login-header">
                    <h2>
                        SIGN IN
                    </h2>
                    <p>
                        Akses layanan administrasi dengan mudah
                    </p>
                </header>
                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label for="email">Email / NIM</label>
                        <div class="input-icon-wrapper">
                            <!-- ICON EMAIL -->
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="22"
                                height="22"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect x="3" y="5" width="18" height="14" rx="2"/>
                                <path d="m3 7 9 6 9-6"/>
                            </svg>
                            <!-- INPUT EMAIL / NIM -->
                            <input
                                type="text"
                                id="email"
                                name="identifier"
                                placeholder="Masukkan email atau NIM"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">
                            Kata Sandi
                        </label>
                        <div class="password-wrapper">
                            <!-- ICON GEMBOK -->
                            <svg
                                class="lock-icon"
                                xmlns="http://www.w3.org/2000/svg"
                                width="22"
                                height="22"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect x="3" y="10" width="18" height="11" rx="2"/>
                                <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
                            </svg>
                            <!-- INPUT PASSWORD -->
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Masukkan kata sandi"
                                autocomplete="current-password"
                                required
                            >
                            <!-- BUTTON LIHAT PASSWORD -->
                            <button
                                type="button"
                                class="toggle-password"
                                id="togglePassword"
                                aria-label="Lihat password"
                            >
                                <svg
                                    id="eyeIcon"
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="22"
                                    height="22"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-option">
                        <label>
                            <input type="checkbox">
                            Ingat saya
                        </label>
                        <a href="../lupa-password/index.html">
                            Lupa kata sandi?
                        </a>
                    </div>
                    <!-- TOMBOL LOGIN -->
                    <button
                        type="submit"
                        class="btn-login"
                        id="loginButton"
                    >
                        <span id="loginButtonText">Masuk</span>

                        <!-- ANIMASI LOADING -->
                        <span
                            id="loginSpinner"
                            class="login-spinner hidden"
                        ></span>
                    </button>
                    <div class="divider">
                        <span></span>
                        <p>atau</p>
                        <span></span>
                    </div>
                    <button 
                    type="button" 
                    class="btn-guest"
                    onclick="window.location.href='../tamu/index.html'"
                    >
                        <!-- Icon User -->
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                        </svg>
                        <span>Masuk sebagai tamu</span>
                    </button>
                    <div class="register-link">
                        Belum memiliki akun?
                        <a href="../registrasi/index.html">
                            Daftar
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script src="login.js"></script>
</body>
</html>
