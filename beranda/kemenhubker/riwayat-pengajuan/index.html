<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Pengajuan | SITARA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kemenhubker.css">
<link rel="stylesheet" href="riwayat.css">
<style>
  .nav-icon{
    width:22px;
    height:22px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex:0 0 22px;
  }

  .nav-icon svg{
    width:19px;
    height:19px;
    stroke-width:1.9;
  }

  .nav-item.active .nav-icon svg{
    stroke:currentColor;
  }
</style>
    <link rel="stylesheet" href="../../../assets/css/kemenhubker-sidebar-theme.css">
    <link rel="stylesheet" href="../../../assets/css/kemenhubker-ui-core.css">
    <link rel="stylesheet" href="riwayat-sitara-content.css">
</head>

<body>
<div class="kemen-container">

  <aside class="sidebar" id="sitaraSidebar" aria-label="Navigasi SITARA"></aside>
<script src="../../../assets/js/kemenhubker-sidebar.js"></script>

  <main class="main-content">

    <header class="topbar">
      <div class="topbar-title">
        <h2>Riwayat Pengajuan</h2>
        <p>Riwayat aktivitas administrasi Kementerian Hubungan Kerja Sama</p>
      </div>

      <div class="topbar-right">
        <div class="topbar-date" id="currentDate">Memuat tanggal...</div>
        <div class="topbar-avatar" id="topbarAvatar">KH</div>
      </div>
    </header>

    <section class="history-page">

      <div class="history-header">
        <div class="history-header-icon" aria-hidden="true">
          <i data-lucide="history"></i>
        </div>

        <div class="history-header-content">
          <h1>Riwayat Pengajuan</h1>
          <p>Telusuri seluruh perjalanan pengajuan yang telah dilakukan oleh kementerian.</p>
        </div>
      </div>

      <div class="history-toolbar">
        <div class="history-search-wrap">
          <i class="history-search-icon" data-lucide="search"></i>
          <input
            id="historySearch"
            type="search"
            autocomplete="off"
            placeholder="Cari nomor agenda atau judul kegiatan..."
            aria-label="Cari nomor agenda atau judul kegiatan"
          >
        </div>

        <div class="history-month-wrap">
          <i class="history-month-icon" data-lucide="calendar-days"></i>
          <select id="historyMonthFilter" aria-label="Filter bulan dan tahun">
            <option value="">Semua Bulan</option>
          </select>
          <i class="history-month-chevron" data-lucide="chevron-down"></i>
        </div>
      </div>

      <div class="history-table-card">
        <div id="historyList">
          <div class="history-empty">
            <span class="history-loading">Memuat riwayat pengajuan...</span>
          </div>
        </div>

        <div class="history-footer" id="historyFooter" style="display:none;">
          <div class="history-count" id="historyCount"></div>
          <div class="history-pagination" id="historyPagination"></div>
        </div>
      </div>

    </section>
  </main>
</div>

<script src="riwayat.js"></script>
<script src="riwayat-month-custom.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
  if(window.lucide)lucide.createIcons();
});
</script>
</body>
</html>
