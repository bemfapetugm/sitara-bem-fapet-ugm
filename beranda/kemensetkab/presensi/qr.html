<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QR Presensi Kegiatan | SITARA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --maroon: #7f2d25;
        --maroon-dark: #64221c;
        --gold: #b9854a;
        --ink: #252525;
        --muted: #707784;
        --line: #eadfda;
        --bg: #fbf8f7;
        --soft: #f9f1ef;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: Inter, Arial, sans-serif;
        color: var(--ink);
      }
      body {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #faf7f6;
        font-size: 14px;
      }
      .page {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: #fff;
        overflow: hidden;
      }
      .brand {
        flex: 0 0 auto;
        min-height: 82px;
        background: linear-gradient(
          110deg,
          #7f2d25 0%,
          #87352d 58%,
          #762820 100%
        );
        color: #fff;
        padding: 16px clamp(24px, 5.7vw, 94px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }
      .brand-main {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }
      .brand-main > div:last-child {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 7px;
        min-width: 0;
      }
      .brand h1 {
        display: block;
        line-height: 1;
        margin: 0;
        letter-spacing: 0.02em;
      }
      .brand p {
        display: block;
        line-height: 1.25;
        margin: 0;
        font-weight: 800;
      }
      .mark {
        width: 54px;
        height: 54px;
        flex: 0 0 54px;
        border-radius: 16px;
        background: #ffffff16;
        border: 1px solid #ffffff30;
        display: grid;
        place-items: center;
        color: #d6a75f;
        font-size: 26px;
      }
      .mark svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .brand h1 {
        font-size: 26px;
        line-height: 1;
        margin: 0 0 2px;
        letter-spacing: 0.02em;
      }
      .brand p {
        font-size: 12px;
        letter-spacing: 0.11em;
        color: #e9e9e9;
        margin: 0;
        font-weight: 500;
      }
      .brand-tag {
        font-size: 13px;
        color: #fff1ed;
        border: 1px solid #ffffff40;
        border-radius: 99px;
        padding: 13px 20px;
        white-space: nowrap;
      }
      #content {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
      }
      .content {
        width: min(1320px, 100%);
        height: 100%;
        margin: 0 auto;
        padding: clamp(24px, 4vh, 58px) clamp(24px, 4vw, 68px);
        display: grid;
        grid-template-columns: minmax(0, 1.12fr) minmax(360px, 0.88fr);
        gap: clamp(28px, 4vw, 64px);
        align-items: center;
      }
      .content > section:first-child {
        min-width: 0;
        padding-right: clamp(0px, 2vw, 28px);
        border-right: 1px solid #f0e4e1;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.14em;
        font-weight: 800;
        color: #b28b4b;
      }
      .title {
        font-size: clamp(30px, 3.2vw, 52px);
        line-height: 1.08;
        color: var(--maroon);
        margin: 12px 0 20px;
        overflow-wrap: anywhere;
      }
      .description {
        font-size: clamp(13px, 1.05vw, 17px);
        line-height: 1.65;
        color: var(--muted);
        margin: 0 0 clamp(18px, 3vh, 32px);
        max-width: 650px;
      }
      .details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 14px;
      }
      .detail {
        border: 1px solid var(--line);
        background: linear-gradient(145deg, #fff 0%, #fdf9f8 100%);
        border-radius: 16px;
        padding: clamp(12px, 1.25vw, 19px);
        min-width: 0;
        min-height: 74px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .detail span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 6px;
      }
      .detail {
        position: relative;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        gap: 14px;
        padding: clamp(12px, 1.25vw, 19px);
        min-height: 88px;
      }
      .detail-icon {
        width: 46px;
        height: 46px;
        flex: 0 0 46px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: #f9ece9;
        color: var(--maroon);
        border: 1px solid #f5e1dd;
      }
      .detail-icon svg {
        width: 23px;
        height: 23px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .detail-copy {
        min-width: 0;
      }
      .detail-copy span {
        font-size: 12px;
        margin-bottom: 5px;
      }
      .detail-copy strong {
        font-size: clamp(12px, 0.95vw, 15px);
      }

      .detail strong {
        display: block;
        font-size: clamp(12px, 0.95vw, 15px);
        line-height: 1.45;
        color: #64221c;
        overflow-wrap: anywhere;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: clamp(14px, 2.5vh, 24px);
        padding: 12px 16px;
        border-radius: 99px;
        background: #eaf7ef;
        color: #287047;
        font-size: 13px;
        font-weight: 700;
      }
      .status.closed {
        background: #fff3e8;
        color: #97531b;
      }
      .dot {
        width: 9px;
        height: 9px;
        background: currentColor;
        border-radius: 50%;
        flex: 0 0 auto;
      }
      .qr-panel {
        width: 100%;
        max-width: 550px;
        justify-self: center;
        min-width: 0;
        max-height: 100%;
        border: 1px solid #eadfda;
        border-radius: 24px;
        padding: clamp(16px, 2vw, 30px);
        text-align: center;
        background: linear-gradient(160deg, #fff 0%, #fffcfb 100%);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        box-shadow: 0 10px 30px #64221c08;
      }
      .qr-frame {
        background: #fff;
        border: 1px solid #e6eaf0;
        border-radius: 20px;
        padding: clamp(12px, 1.5vw, 24px);
        display: grid;
        place-items: center;
        min-height: 0;
        flex: 0 1 auto;
      }
      .qr-frame img {
        display: block;
        width: min(100%, min(37vh, 440px));
        max-height: 42vh;
        height: auto;
        aspect-ratio: 1/1;
        object-fit: contain;
        image-rendering: pixelated;
      }
      .qr-title {
        font-size: clamp(16px, 1.5vw, 24px);
        font-weight: 800;
        color: var(--maroon);
        margin: 12px 0 7px;
      }
      .qr-help {
        font-size: clamp(11px, 0.9vw, 14px);
        color: var(--muted);
        line-height: 1.55;
        margin: 0 auto;
        max-width: 420px;
      }
      .actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: clamp(12px, 2vh, 22px);
      }
      .btn {
        appearance: none;
        border: 1px solid #e6d6d2;
        background: #fff;
        color: var(--maroon);
        border-radius: 13px;
        padding: 12px 20px;
        font:
          700 14px Inter,
          sans-serif;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn:hover {
        filter: brightness(0.97);
        transform: translateY(-1px);
      }
      #fullscreen {
        background: #fff;
        color: var(--maroon);
        border-color: #e5cfc9;
      }
      #print {
        background: linear-gradient(135deg, #87352d, #762820);
        color: #fff;
        border-color: #762820;
      }
      #print:hover {
        background: #64221c;
      }
      .message {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px;
        text-align: center;
        color: var(--muted);
        line-height: 1.7;
      }
      .message strong {
        display: block;
        color: var(--maroon);
        font-size: 22px;
        margin-bottom: 8px;
      }
      .footer {
        flex: 0 0 auto;
        min-height: 68px;
        background: #fbf8f7;
        border-top: 1px solid #ede2df;
        padding: 16px clamp(24px, 5.7vw, 94px);
        color: #747985;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .token {
        font-size: 10px;
        color: #8994a4;
        overflow-wrap: anywhere;
        margin-top: 10px;
      }
      @media (max-height: 760px) and (min-width: 761px) {
        .brand {
          min-height: 68px;
          padding-top: 10px;
          padding-bottom: 10px;
        }
        .mark {
          width: 44px;
          height: 44px;
          flex-basis: 44px;
          border-radius: 13px;
          font-size: 22px;
        }
        .brand-main > div:last-child {
          gap: 2px;
        }
        .brand h1 {
          font-size: 22px;
          margin-bottom: 0;
        }
        .brand p {
          font-size: 10px;
        }
        .brand-tag {
          padding: 10px 16px;
          font-size: 11px;
        }
        .content {
          padding: 18px 4vw;
          gap: 28px;
        }
        .title {
          font-size: clamp(28px, 2.7vw, 40px);
          margin: 8px 0 12px;
        }
        .description {
          font-size: 12px;
          margin-bottom: 14px;
        }
        .details {
          gap: 8px 10px;
        }
        .detail {
          padding: 9px 10px;
          min-height: 58px;
          border-radius: 13px;
          gap: 10px;
        }
        .detail-icon {
          width: 34px;
          height: 34px;
          flex-basis: 34px;
          border-radius: 10px;
        }
        .detail-icon svg {
          width: 18px;
          height: 18px;
        }
        .detail-copy span {
          font-size: 10px;
        }
        .detail-copy strong {
          font-size: 12px;
        }
        .detail span {
          font-size: 10px;
          margin-bottom: 4px;
        }
        .detail strong {
          font-size: 12px;
        }
        .status {
          margin-top: 12px;
          padding: 9px 12px;
          font-size: 11px;
        }
        .qr-panel {
          padding: 12px 16px;
          border-radius: 19px;
        }
        .qr-frame {
          padding: 10px;
          border-radius: 15px;
        }
        .qr-frame img {
          width: min(100%, 39vh);
          max-height: 35vh;
        }
        .qr-title {
          font-size: 16px;
          margin: 8px 0 4px;
        }
        .qr-help {
          font-size: 10px;
        }
        .actions {
          margin-top: 10px;
          gap: 8px;
        }
        .btn {
          padding: 9px 16px;
          font-size: 12px;
        }
        .token {
          margin-top: 6px;
          font-size: 9px;
        }
        .footer {
          min-height: 48px;
          padding-top: 10px;
          padding-bottom: 10px;
          font-size: 10px;
        }
      }
      @media (max-width: 760px) {
        body {
          height: auto;
          min-height: 100vh;
          overflow: auto;
        }
        .page {
          height: auto;
          min-height: 100vh;
          overflow: visible;
        }
        .brand {
          padding: 17px 20px;
          min-height: 70px;
        }
        .brand-main {
          gap: 12px;
        }
        .brand-main > div:last-child {
          gap: 5px;
        }
        .mark {
          width: 42px;
          height: 42px;
          flex-basis: 42px;
          font-size: 21px;
          border-radius: 12px;
        }
        .brand h1 {
          font-size: 20px;
        }
        .brand p {
          font-size: 8px;
          letter-spacing: 0.08em;
        }
        .brand-tag {
          display: none;
        }
        #content {
          flex: 1 0 auto;
        }
        .content {
          height: auto;
          grid-template-columns: 1fr;
          gap: 22px;
          padding: 24px 20px;
        }
        .content > section:first-child {
          padding: 0;
          border-right: 0;
        }
        .eyebrow {
          font-size: 10px;
        }
        .title {
          font-size: 30px;
          margin: 8px 0 12px;
        }
        .description {
          font-size: 13px;
          margin-bottom: 18px;
        }
        .details {
          gap: 9px;
        }
        .detail {
          padding: 12px;
          min-height: 64px;
          border-radius: 12px;
          gap: 10px;
        }
        .detail-icon {
          width: 36px;
          height: 36px;
          flex-basis: 36px;
          border-radius: 10px;
        }
        .detail-icon svg {
          width: 19px;
          height: 19px;
        }
        .detail-copy span {
          font-size: 10px;
        }
        .detail-copy strong {
          font-size: 12px;
        }
        .detail span {
          font-size: 10px;
        }
        .detail strong {
          font-size: 12px;
        }
        .status {
          margin-top: 14px;
          padding: 9px 12px;
          font-size: 11px;
        }
        .qr-panel {
          width: 100%;
          max-width: 430px;
          padding: 16px;
          border-radius: 18px;
        }
        .qr-frame {
          padding: 12px;
          border-radius: 14px;
        }
        .qr-frame img {
          width: min(100%, 300px);
          max-height: none;
        }
        .qr-title {
          font-size: 16px;
          margin: 12px 0 6px;
        }
        .qr-help {
          font-size: 11px;
        }
        .actions {
          margin-top: 14px;
        }
        .btn {
          font-size: 12px;
          padding: 10px 15px;
        }
        .footer {
          padding: 13px 20px;
          min-height: 0;
          flex-direction: column;
          align-items: flex-start;
          gap: 5px;
          font-size: 10px;
        }
        .message {
          min-height: 50vh;
        }
      }
      @media print {
        @page {
          size: auto;
          margin: 0;
        }
        body {
          height: auto;
          min-height: 0;
          overflow: visible;
          background: #fff;
        }
        .page {
          height: auto;
          min-height: 100vh;
          box-shadow: none;
          border: 0;
        }
        .brand,
        .footer {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
        .actions,
        .footer .no-print {
          display: none !important;
        }
        .content {
          padding: 22px;
          gap: 20px;
        }
        .qr-panel {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="brand">
        <div class="brand-main">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4zM16 16h4v4h-4z"
              />
            </svg>
          </div>
          <div>
            <h1>SITARA</h1>
            <p>Sistem Integrasi Tata Birokrasi Mahasiswa</p>
          </div>
        </div>
        <span class="brand-tag">PRESENSI DIGITAL</span>
      </header>
      <div id="content" class="message">
        <strong>Menyiapkan QR Presensi...</strong>Mohon tunggu sebentar.
      </div>
      <footer class="footer">
        <span>Presensi Kegiatan · SITARA</span
        ><span class="no-print"
          >Halaman ini dapat ditampilkan melalui proyektor atau dicetak.</span
        >
      </footer>
    </main>
    <script src="qr.js"></script>
  </body>
</html>
